# The Dapr app-id. Must match the appID in dev-parallelization-workflow.yaml, and must stay stable across
# restarts so a resumed run belongs to the same app. The agent registry records it too.
spring.application.name=parallelization-workflow

# A command-line app: no HTTP server. The workflow worker talks *out* to the Catalyst sidecar over
# gRPC, so nothing needs to listen on a port.
spring.main.web-application-type=none

# Java 21 virtual threads: a durable ChatClient.call() blocks until its workflow completes, so that
# wait parks a virtual thread instead of a platform one.
spring.threads.virtual.enabled=true

# ── Durability (diagrid-spring-ai) ──────────────────────────────────────────────
# Each ChatClient.call() runs as a Dapr Workflow. On Catalyst the workflow state store is managed,
# so there is no component YAML to write. These are the defaults, shown for clarity.
diagrid.spring-ai.enabled=true
diagrid.spring-ai.completion-timeout=5m

# ── LLM: OpenAI via Spring AI ───────────────────────────────────────────────────
# Export OPENAI_API_KEY in the environment.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini

# Quiet the Dapr Workflow engine's internal chatter so the pattern's own output stays readable.
logging.level.io.dapr.durabletask=WARN
logging.level.io.dapr.workflows=WARN
